<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0d1527" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text AI Gradient -->
    <linearGradient id="textAiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; letter-spacing: -0.03em; }
    .title-ai { fill: url(#textAiGrad); font-weight: 900; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
  </style>

  <!-- Banner Container -->
  <rect x="2" y="2" width="956" height="276" rx="24" fill="url(#bannerBg)" stroke="url(#bannerBorder)" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="280" />
    <line x1="120" y1="0" x2="120" y2="280" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="280" y1="0" x2="280" y2="280" />
    <line x1="360" y1="0" x2="360" y2="280" />
    <line x1="440" y1="0" x2="440" y2="280" />
    <line x1="520" y1="0" x2="520" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="680" y1="0" x2="680" y2="280" />
    <line x1="760" y1="0" x2="760" y2="280" />
    <line x1="840" y1="0" x2="840" y2="280" />
    <line x1="920" y1="0" x2="920" y2="280" />
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="220" x2="960" y2="220" />
  </g>

  <!-- Glows -->
  <circle cx="160" cy="140" r="140" fill="url(#glowLeft)" />
  <circle cx="800" cy="90" r="160" fill="url(#glowRight)" />

  <!-- LOGO MARK ON THE LEFT -->
  <g transform="translate(60, 42)">
    <!-- Squircle base -->
    <rect x="0" y="0" width="196" height="196" rx="44" fill="#0f172a" stroke="url(#bannerBorder)" stroke-width="2" />
    
    <!-- Badge dialog contour -->
    <path
      d="M 46 40 H 150 C 164 40 176 52 176 66 V 118 C 176 132 164 144 150 144 H 74 L 46 166 V 144 H 46 C 32 144 20 132 20 118 V 66 C 20 52 32 40 46 40 Z"
      fill="#1e293b"
      opacity="0.85"
      stroke="#818cf8"
      stroke-opacity="0.4"
      stroke-width="1.2"
    />

    <!-- Secondary Star (Top Right) -->
    <path
      d="M 144 50 Q 144 60 134 60 Q 144 60 144 70 Q 144 60 154 60 Q 144 60 144 50 Z"
      fill="#38bdf8"
    />

    <!-- Main AI Super-Spark (Center) -->
    <g filter="url(#softGlow)">
      <path
        d="M 98 50 Q 98 92 56 92 Q 98 92 98 134 Q 98 92 140 92 Q 98 92 98 50 Z"
        fill="url(#sparkGrad)"
      />
    </g>

    <!-- Spark Core -->
    <path
      d="M 98 68 Q 98 92 74 92 Q 98 92 98 116 Q 98 92 122 92 Q 98 92 98 68 Z"
      fill="#ffffff"
      opacity="0.9"
    />
    <circle cx="98" cy="92" r="3" fill="#ffffff" />

    <!-- Provider Dots -->
    <circle cx="68" cy="126" r="3.5" fill="#10a37f" />
    <circle cx="88" cy="129" r="3.5" fill="#d97706" />
    <circle cx="108" cy="129" r="3.5" fill="#3b82f6" />
    <circle cx="128" cy="126" r="3.5" fill="#a855f7" />
  </g>

  <!-- TEXT CONTENT ON THE RIGHT -->
  <g transform="translate(300, 72)">
    <!-- Version Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="24" rx="12" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <text x="12" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#818cf8" letter-spacing="0.05em">UNIVERSAL COMPONENT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="62" class="title">
      ask-<tspan class="title-ai">ai</tspan>-badge
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" class="sub">
      The "Ask AI about your product" button for any framework
    </text>

    <!-- AI Providers Pills / Badges -->
    <g transform="translate(0, 126)">
      <!-- Pill 1: ChatGPT -->
      <rect x="0" y="0" width="94" height="28" rx="8" fill="#131d2e" stroke="#10a37f" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10a37f" />
      <text x="26" y="19" class="badge-text">ChatGPT</text>

      <!-- Pill 2: Claude -->
      <rect x="104" y="0" width="86" height="28" rx="8" fill="#131d2e" stroke="#d97706" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="118" cy="14" r="4" fill="#d97706" />
      <text x="130" y="19" class="badge-text">Claude</text>

      <!-- Pill 3: Gemini -->
      <rect x="200" y="0" width="88" height="28" rx="8" fill="#131d2e" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="214" cy="14" r="4" fill="#3b82f6" />
      <text x="226" y="19" class="badge-text">Gemini</text>

      <!-- Pill 4: Perplexity -->
      <rect x="298" y="0" width="102" height="28" rx="8" fill="#131d2e" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="312" cy="14" r="4" fill="#22d3ee" />
      <text x="324" y="19" class="badge-text">Perplexity</text>

      <!-- Pill 5: Grok -->
      <rect x="410" y="0" width="76" height="28" rx="8" fill="#131d2e" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="424" cy="14" r="4" fill="#c084fc" />
      <text x="436" y="19" class="badge-text">Grok</text>
    </g>
  </g>
</svg>
