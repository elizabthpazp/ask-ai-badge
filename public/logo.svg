<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.6" />
    </linearGradient>

    <!-- Badge Container Gradient -->
    <linearGradient id="badgeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Primary AI Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="65%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <!-- Inner Core Highlight -->
    <linearGradient id="coreHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.4" />
    </linearGradient>

    <!-- Companion Star Gradient -->
    <linearGradient id="starGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="10" y="10" width="236" height="236" rx="54" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Light Pulse -->
  <circle cx="128" cy="118" r="82" fill="url(#ambientGlow)" />

  <!-- Badge / Dialog Capsule Contour -->
  <path
    d="M 64 54 H 192 C 210 54 224 68 224 86 V 148 C 224 166 210 180 192 180 H 98 L 64 206 V 180 H 64 C 46 180 32 166 32 148 V 86 C 32 68 46 54 64 54 Z"
    fill="url(#badgeFill)"
    stroke="url(#badgeBorder)"
    stroke-width="1.5"
  />

  <!-- Top Glass Highlight Rim -->
  <path
    d="M 64 54 H 192 C 208 54 220 65 223 80 C 190 88 130 90 33 80 C 36 65 48 54 64 54 Z"
    fill="#ffffff"
    opacity="0.04"
  />

  <!-- Secondary Companion Star (Top Right) -->
  <path
    d="M 184 66 Q 184 78 172 78 Q 184 78 184 90 Q 184 78 196 78 Q 184 78 184 66 Z"
    fill="url(#starGrad2)"
    opacity="0.9"
  />
  <circle cx="184" cy="78" r="1.5" fill="#ffffff" />

  <!-- Mini Sparkle (Bottom Left) -->
  <path
    d="M 68 152 Q 68 158 62 158 Q 68 158 68 164 Q 68 158 74 158 Q 68 158 68 152 Z"
    fill="#38bdf8"
    opacity="0.75"
  />

  <!-- Main AI Super-Spark (Center) -->
  <g filter="url(#softGlow)">
    <path
      d="M 128 66 Q 128 118 76 118 Q 128 118 128 170 Q 128 118 180 118 Q 128 118 128 66 Z"
      fill="url(#sparkGrad)"
    />
  </g>

  <!-- Luminous Inner Core -->
  <path
    d="M 128 88 Q 128 118 98 118 Q 128 118 128 148 Q 128 118 158 118 Q 128 118 128 88 Z"
    fill="url(#coreHighlight)"
  />
  <circle cx="128" cy="118" r="3.5" fill="#ffffff" />

  <!-- The 4 Multi-Provider AI Constellation Dots (ChatGPT, Claude, Gemini, Perplexity) -->
  <g id="provider-dots" transform="translate(0, 0)">
    <!-- ChatGPT Green -->
    <circle cx="92" cy="158" r="4.5" fill="#10a37f" />
    <circle cx="92" cy="158" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Claude Coral -->
    <circle cx="116" cy="162" r="4.5" fill="#d97706" />
    <circle cx="116" cy="162" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Gemini Blue/Cyan -->
    <circle cx="140" cy="162" r="4.5" fill="#3b82f6" />
    <circle cx="140" cy="162" r="2" fill="#ffffff" opacity="0.8" />

    <!-- Perplexity / Grok Teal & Magenta -->
    <circle cx="164" cy="158" r="4.5" fill="#a855f7" />
    <circle cx="164" cy="158" r="2" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
